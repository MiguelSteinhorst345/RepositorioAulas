<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <!--  -->

    <form action="">
        <h2>Formulario de Cadastro</h2>
        <label for="nomr">Nome</label> <!-- da um titulo para o campo abaixo-->
        <input type="text" name="nome" id=""> <!-- input é o campo onde vamos escrever algo -->

        <label for="email">Email</label>
        <input type="email" name="email" id="">

        <label for="senha">Senha</label>
        <input type="password" name="senha" id="">

        <label for="escolhas">O que você sabe?</label>
        <input type="checkbox" name="escolhas" values="js" id="">JS
        <input type="checkbox" name="escolhas" values="html" id="">HTML
        <input type="checkbox" name="escolhas" values="css" id="">CSS

        <label for="genero">Genero</label>
        <input type="radio" name="genero" value="masculino" id="">Masculino
           <input type="radio" name="genero" value="feminino" id="">Feminino
              <input type="radio" name="genero" value="indefinido" id="">Indefinifo
                 <input type="radio" name="genero" value="nao informado" id="">Prefiro não informar
                 
                 <!-- Select (lista suspensa) -->
                  <label for="curso">Curso desejado:</label><br>
                  <select name="curso" id="">
                    <option value="html">HTML</option>
                         <option value="js">Javascript</option>
                              <option value="css">CSS</option>
                  </select>

                  <label for="mensagem">Mensagem</label>
                  <textarea name="mensagem" id="" cols="30" rows="4"></textarea>
                  <label for="nascimento">Data de Nascimento</label>
                  <input type="date" name="nascimento" id="">
                  <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
